<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boucing Balls</title>
    <style>
        :root {
            --bg: #0b0f14;
            --panel: #121820;
            --panel-hover: #18222d;
            --border: #223041;
            --text: #d7e1ea;
            --muted: #8ba0b4;
            --accent: #4aa3ff;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .control-panel {
            width: 25vw;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 14px;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group label {
            font-size: 13px;
            color: var(--muted);
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }
        .control-row output {
            min-width: 48px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }
        .toggle-row label {
            margin: 0;
        }
        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        button {
            background-color: var(--panel-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
        }
        button:hover {
            background-color: var(--border);
        }
        .apply-button {
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .apply-button:hover {
            filter: brightness(1.1);
        }
        .color-button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <canvas id="bouncing-canvas"></canvas>
    <div class="control-panel">
        <div class="control-group">
            <label for="elasticity">Elasticidade (e):</label>
            <div class="control-row">
                <input type="range" id="elasticity" min="0" max="1" step="0.01" value="0.92">
                <output id="elasticity-value">0.92</output>
            </div>
        </div>
        <div class="control-group">
            <label for="gravity">Gravidade:</label>
            <div class="control-row">
                <input type="range" id="gravity" min="0.2" max="3" step="0.1" value="2">
                <output id="gravity-value">2</output>
            </div>
        </div>
        <button type="button" class="apply-button" id="apply-constants">Aplicar</button>
        <div class="control-group">
            <div class="toggle-row">
                <input type="checkbox" id="trails-toggle">
                <label for="trails-toggle">Rastros</label>
            </div>
            <div class="control-row" id="trails-length-row" hidden>
                <input type="range" id="trails-length" min="1" max="10" step="1" value="4">
                <output id="trails-length-value">4</output>
            </div>
        </div>
        <div class="buttons-row">
            <button type="button" id="clear-particles">Limpar</button>
            <button type="button" id="add-particle">Adicionar</button>
        </div>
        <div class="buttons-row">
            <button type="button"class="color-button" id="color-black" style="background-color:#000000" title="Preto"></button>
            <button type="button"class="color-button" id="color-red" style="background-color:#ff0000" title="Vermelho"></button>
            <button type="button"class="color-button" id="color-green" style="background-color:#00ff00" title="Verde"></button>
            <button type="button" class="color-button" id="color-blue" style="background-color:#0000ff" title="Azul"></button>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>

<!--
    Shared example header (Vectra-examples).
    Do not open this file directly: it is loaded via fetch() by
    examples/shared/header.js and injected at the top of the <body> of each example.

    The relative links (../../index.html) are resolved relative to the page that
    loads the header (all examples live under examples/<name>/).
    This block also defines the Vectra brand tokens (--vt-*), mirroring
    styles/vars.css from the landing page so examples use the same colors.
-->
<style>
    :root {
        --vt-bg: #0b0f14;
        --vt-panel: #121820;
        --vt-panel-hover: #18222d;
        --vt-border: #223041;
        --vt-text: #d7e1ea;
        --vt-muted: #8ba0b4;
        --vt-accent: #4aa3ff;
        --vt-header-h: 60px;
    }

    .vectra-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        height: var(--vt-header-h);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 16px;
        background: color-mix(in srgb, var(--vt-bg) 86%, transparent);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--vt-border);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .vh-brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: var(--vt-accent);
    }

    .vh-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: monospace;
        font-size: 13px;
        line-height: 1;
        text-decoration: none;
        color: var(--vt-text);
        background: var(--vt-panel);
        border: 1px solid var(--vt-border);
        border-radius: 999px;
        padding: 8px 14px;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            color 0.15s ease;
    }

    .vh-btn:hover {
        background: var(--vt-panel-hover);
        border-color: color-mix(in srgb, var(--vt-accent) 55%, var(--vt-border));
        color: var(--vt-text);
    }

    .vh-home {
        color: var(--vt-accent);
        border-color: color-mix(in srgb, var(--vt-accent) 45%, transparent);
        background: transparent;
    }

    .vh-home:hover {
        background: color-mix(in srgb, var(--vt-accent) 14%, transparent);
        color: var(--vt-accent);
    }

    .vh-gh svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
    }

    @media (max-width: 480px) {
        .vectra-header {
            gap: 8px;
        }

        .vh-brand {
            font-size: 18px;
        }

        .vh-btn {
            padding: 7px 10px;
            font-size: 12px;
        }
    }
</style>
<header class="vectra-header">
    <strong class="vh-brand">Vectra</strong>
    <a class="vh-btn vh-home" href="../../index.html" aria-label="Back to the homepage">
        ← Home
    </a>
    <a
        class="vh-btn vh-gh"
        href="https://github.com/caetanoag/vectra"
        target="_blank"
        rel="noopener"
        aria-label="Vectra repository on GitHub"
    >
        <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
    </a>
</header>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Solar System</title>
    <script src="../shared/header.js" defer></script>
    <style>
        :root {
            --vt-bg: #0b0f14;
            --vt-panel: #121820;
            --vt-panel-hover: #18222d;
            --vt-border: #223041;
            --vt-text: #d7e1ea;
            --vt-muted: #8ba0b4;
            --vt-accent: #4aa3ff;
            --vt-header-h: 60px;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--vt-bg, #0b0f14);
        }

        canvas {
            display: block;
            touch-action: none;
            background-color: black;
            max-width: 100vw;
            max-height: 100vh;
        }

        #planetMenu {
            position: fixed;
            top: calc(var(--vt-header-h, 60px) + 12px);
            right: 12px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            background: var(--vt-panel, #121820);
            border: 1px solid var(--vt-border, #223041);
            border-radius: 10px;
            color: var(--vt-text, #d7e1ea);
            font-family: monospace;
            font-size: 18px;
            max-height: calc(100vh - var(--vt-header-h, 60px) - 24px);
            overflow-y: auto;
            user-select: none;
            box-sizing: border-box;
        }

        #planetMenu .entry {
            cursor: pointer;
            white-space: nowrap;
            padding: 6px 8px;
            border-radius: 4px;
        }

        #planetMenu .entry:hover {
            background: var(--vt-panel-hover, #18222d);
        }

        #planetMenu .speed {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            white-space: nowrap;
        }

        #planetMenu .speed select {
            background: var(--vt-bg, #0b0f14);
            color: var(--vt-text, #d7e1ea);
            border: 1px solid var(--vt-border, #223041);
            border-radius: 4px;
            padding: 4px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
        }

        #menuToggle {
            display: none;
            position: fixed;
            top: calc(var(--vt-header-h, 60px) + 12px);
            right: 12px;
            background: var(--vt-panel, #121820);
            color: var(--vt-text, #d7e1ea);
            border: 1px solid var(--vt-border, #223041);
            border-radius: 8px;
            font-size: 24px;
            line-height: 1;
            padding: 8px 14px;
            cursor: pointer;
            z-index: 10;
        }

        @media (max-width: 640px) {
            #menuToggle {
                display: block;
            }

            #planetMenu {
                top: calc(var(--vt-header-h, 60px) + 62px);
                max-width: 80vw;
                max-height: calc(100vh - var(--vt-header-h, 60px) - 80px);
                font-size: 16px;
            }

            #planetMenu .speed select {
                padding: 8px 10px;
            }

            #planetMenu .entry {
                padding: 12px 10px;
            }

            #planetMenu.collapsed {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas" width="800" height="600"></canvas>
    
    <button id="menuToggle" type="button">☰</button>
    
    <div id="planetMenu"></div>
    
    <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Solar System</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f14;
        }

        canvas {
            display: block;
            touch-action: none;
            background-color: black;
            max-width: 100vw;
            max-height: 100vh;
        }

        #planetMenu {
            position: fixed;
            top: 50px;
            right: 12px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ddd;
            font-family: monospace;
            font-size: 18px;
            max-height: 80vh;
            overflow-y: auto;
            user-select: none;
            box-sizing: border-box;
        }

        #planetMenu .entry {
            cursor: pointer;
            white-space: nowrap;
            padding: 6px 8px;
            border-radius: 4px;
        }

        #planetMenu .entry:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #planetMenu .speed {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            white-space: nowrap;
        }

        #planetMenu .speed select {
            background: black;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 4px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
        }

        #menuToggle {
            display: none;
            position: fixed;
            top: 50px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 24px;
            line-height: 1;
            padding: 8px 14px;
            cursor: pointer;
            z-index: 10;
        }

        /* --- Responsivo Mobile --- */
        @media (max-width: 640px) {
            #menuToggle {
                display: block;
            }

            #planetMenu {
                /* Desce o menu para 100px para ficar exatamente abaixo do botão */
                top: 100px;
                max-width: 80vw;
                max-height: calc(100vh - 120px);
                font-size: 16px;
            }

            #planetMenu .speed select {
                padding: 8px 10px;
            }

            #planetMenu .entry {
                padding: 12px 10px; 
            }

            #planetMenu.collapsed {
                display: none; 
            }
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas" width="800" height="600"></canvas>
    
    <button id="menuToggle" type="button">☰</button>
    
    <div id="planetMenu"></div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
